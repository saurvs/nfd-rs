name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            toolchain: stable
          - name: Linux (portal)
            os: ubuntu-latest
            toolchain: stable
          - name: Linux (gtk3)
            os: ubuntu-latest
            toolchain: stable
            features: gtk3
          - name: Windows (MSVC)
            os: windows-latest
            toolchain: stable
          - name: Windows (GNU)
            os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            mingw: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev ${{ matrix.features == 'gtk3' && 'libgtk-3-dev' || '' }}
      - name: Install MinGW-w64
        if: matrix.mingw
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW-w64 on PATH
        if: matrix.mingw
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
      - run: rustc -vV
      - name: Test (default features)
        run: cargo test --features "${{ matrix.features }}"
      - name: Test (raw-window-handle)
        run: cargo test --features "raw-window-handle ${{ matrix.features }}"
      - name: Clippy
        run: |
          cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
          cargo clippy --all-targets --features "raw-window-handle ${{ matrix.features }}" -- -D warnings
      - name: Build for Intel macOS (allowedFileTypes code path)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --all-targets --features raw-window-handle --target x86_64-apple-darwin

  msrv:
    name: MSRV 1.85 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo test --features raw-window-handle

  package:
    name: Format, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo doc --no-deps --all-features
      - name: Package (builds the packaged crate from its own sources)
        run: |
          cargo package
          cargo package --list
      - run: cargo publish --dry-run
